name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build · Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Architecture guard (no JSON file pretending to be a DB)
        run: npm run guard

      - name: Typecheck API
        run: npx tsc -p apps/api --noEmit

      - name: Typecheck web
        run: npx tsc -p apps/web --noEmit

      - name: Migrations + seed against a fresh database
        run: |
          npm run build:api
          DB_PATH=./data/ci.sqlite node apps/api/dist/db/cli.js reset
          DB_PATH=./data/ci.sqlite node apps/api/dist/db/cli.js status

      - name: API tests
        run: npm test

      - name: Web production build
        run: npm run build -w @relay/web

      - name: Postgres schema applies cleanly
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=pg -e POSTGRES_USER=relay -e POSTGRES_DB=relay -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U relay -d relay && break; sleep 2; done
          docker run --rm --network host -v "$PWD/db/postgres:/sql:ro" -e PGPASSWORD=pg postgres:16-alpine \
            sh -c 'until psql -h 127.0.0.1 -U relay -d relay -c "select 1" >/dev/null 2>&1; do sleep 1; done; psql -h 127.0.0.1 -U relay -d relay -v ON_ERROR_STOP=1 -f /sql/schema.sql'
          docker exec pg psql -U relay -d relay -c "\dt" | head -40
