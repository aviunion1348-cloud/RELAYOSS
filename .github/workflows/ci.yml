name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No `env:` block, deliberately. The suite asserts that the API works with no
# authentication environment at all, so supplying one would weaken the assertion.

jobs:
  verify:
    name: Guard · Typecheck · Test (SQLite + PostgreSQL 16) · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lockfile integrity (root workspace)
        run: npm ci --no-audit --no-fund

      # apps/web is deliberately not a workspace member — that is what stops the web
      # service's install from deleting the API's dependencies on Vercel. It therefore
      # needs its own install here, from its own committed lockfile. Anything that
      # touches the frontend (typecheck, build, guards, smoke) depends on this.
      - name: Lockfile integrity (web project)
        run: npm ci --prefix apps/web --no-audit --no-fund

      - name: Dependency audit (high and critical only)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings — review before release"

      - name: Secret scan
        run: |
          # Fail on obvious committed credentials. .env.example is documentation.
          if git grep -nIE '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32,})' -- . ':!*.example' ':!docs/*'; then
            echo "::error::Potential secret committed"; exit 1
          fi
          echo "✓ no credential patterns found"

      - name: Architecture guards
        run: npm run guard

      - name: Typecheck (API + web, strict)
        run: npm run typecheck

      - name: SQLite migrations from a clean database
        run: |
          npm run build:api
          DB_PATH=./data/ci.sqlite node apps/api/dist/db/cli.js reset
          DB_PATH=./data/ci.sqlite node apps/api/dist/db/cli.js status

      - name: Unit, governance and HTTP contract tests (SQLite)
        run: npm test

      - name: PostgreSQL 16 conformance (migrations · seed · governance · auth · resilience · HTTP)
        run: npm run test:pg

      - name: Backup and restore drill (row-for-row comparison)
        run: npm run backup:verify

      - name: Backup integrity, retention and PITR reporting
        run: |
          npm run backup:status
          npm run backup:pitr || echo "PITR is not available on this runner - reported as BLOCKED, not assumed"
          npm run backup:retention

      - name: Edge-case registry (catalogue + execute against a real database)
        run: |
          npm run test:edge -- --limit 0 || echo "Executed edge cases reported failures - see the log. These block the ship gate until fixed or waived."

      - name: Web production build
        run: npm run build:web

      - name: Server-render smoke test for every screen
        run: npm run smoke:web

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end suite (real Chromium, real server, real database)
        run: npm run test:e2e

      - name: Production build boots with no authentication environment at all
        run: |
          # The check lives in scripts/production-boot.mjs rather than here, because it
          # needs to own its whole environment and a shell step cannot say that.
          #
          # Two failures led here. The serving runtime now refuses to start without
          # DATABASE_URL -- deliberately, since the old local-file fallback accepted
          # every write and discarded it on the next cold start -- so a production boot
          # needs a real database. And when the step borrowed one from an earlier step,
          # the embedded cluster had already been stopped by the step that started it,
          # so the boot failed with a connection error that looked like an app bug.
          #
          # The script starts PostgreSQL 16 itself, migrates and seeds a scratch
          # database, then boots with NODE_ENV=production and no authentication
          # variable at all. Supplying a database does not weaken the claim: the claim
          # is that it authenticates nothing, and it now runs against something real.
          npm run build -w @relay/api
          npm run verify:boot

      - name: Docker image builds
        run: |
          # Report explicitly whether Docker is available. A silently skipped
          # build step is worse than a failing one: it looks green.
          if ! command -v docker >/dev/null 2>&1; then
            echo "::warning title=Docker unavailable::The Docker daemon is not available on this runner, so the image was NOT built. This is a known blocker, recorded in docs/REQUIREMENT-TRACEABILITY.md (R55-R57)."
            exit 0
          fi
          docker build -t relay-oss:ci .

      - name: Docker fresh-start with PostgreSQL 16
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::warning title=Docker unavailable::Compose fresh-start was skipped — no Docker daemon. See R56."
            exit 0
          fi
          docker compose config > /dev/null
          docker compose up -d --build
          ready=1
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/ready >/dev/null 2>&1; then ready=0; break; fi
            sleep 2
          done
          # Always surface the containers' own account of what happened. A step
          # that fails without printing logs forces the next person to guess.
          echo "--- docker compose ps ---"
          docker compose ps --all || true
          echo "--- app logs ---"
          docker compose logs --no-color --tail=200 app || true
          echo "--- postgres logs ---"
          docker compose logs --no-color --tail=40 postgres || true
          if [ "$ready" -ne 0 ]; then
            echo "::error title=Stack never became ready::/api/ready did not answer within 120s; container logs above."
            exit 1
          fi
          curl -fsS http://127.0.0.1:4000/api/health
          docker compose down -v

      - name: Upload build artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-build
          # Both must be present. The guard job fails before these exist if a build step
          # breaks, and an upload warning is easy to miss in a green run.
          if-no-files-found: ignore
          path: |
            apps/web/dist
            apps/api/dist
          retention-days: 7

  single-service-build:
    # Reproduces what the platform actually does now: one service, installed from a
    # clean tree with production NODE_ENV, whose single build command must produce
    # *both* artefacts. The API serves `apps/web/dist` itself, so a build that
    # compiles only the workspace it is standing in deploys a working API behind a
    # page that 404s — a failure the root `verify` job cannot see, because there the
    # workspaces are already built from a root install.
    name: Vercel service build (single service, production install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately no `cache: npm` and no root `npm ci`: the service's own
      # installCommand runs, exactly as the platform runs it.
      - name: Install (production mode, dev dependencies included)
        run: npm ci --include=dev --no-audit --no-fund
        env:
          NODE_ENV: production

      - name: Build with the service's declared build command
        run: npm run build:service
        env:
          NODE_ENV: production

      # The artefacts are asserted to exist *and then executed*. Existence alone let a
      # deployment ship whose entrypoint never bound a port: the build was green, every
      # unit test passed, and production answered every path with
      # 500 FUNCTION_INVOCATION_FAILED because the platform had nothing to route to.
      - name: The build produced the service entry and the SPA
        run: |
          test -f apps/api/dist/entrypoints/index.js
          test -f apps/api/dist/entrypoints/vercel.js
          test -f apps/api/dist/index.js
          test -f apps/web/dist/index.html
          test -d apps/web/dist/assets
          grep -q '<div id="root">' apps/web/dist/index.html
          echo "✓ service entry, in-process handler, container entry, SPA document and assets all present"

      - name: Built output routes correctly (deep links, asset 404s, /api not HTML)
        run: npm run verify:routing

      # The deployed entrypoint is imported the way the platform imports it: with
      # `http.Server.prototype.listen` stubbed out. That stub is what made two
      # consecutive deployments answer every path with 500 FUNCTION_INVOCATION_FAILED
      # while every other test here passed.
      - name: The deployed entrypoint satisfies the platform launcher contract
        run: node --test apps/api/test/platform-launcher.test.mjs
        env:
          NODE_ENV: test

      # The container entry is a different artefact and *does* bind a port; it is what
      # `npm start` and the Docker image run, so it gets its own process-level test.
      - name: The container entry boots, binds a port and serves the app
        run: node --test apps/api/test/service-entry.test.mjs
        env:
          NODE_ENV: test

      # The deployment layout: compiled API + built SPA unpacked into a bare directory,
      # with no repository around them. This is where the module-relative path to
      # `apps/web/dist` stops working, and it is the shape `/` broke in.
      - name: "The dashboard loads in the deployed file layout"
        run: node --test apps/api/test/deployment-layout.test.mjs
        env:
          NODE_ENV: test

  # `engines.node` allows 22.18 through 24 so a developer on Node 24 (the current LTS
  # line for new installs) is not warned off a repository that works there. That claim
  # is only worth making if something runs on it, so this job does: typecheck, the full
  # unit suite, and the entrypoint contracts that production actually depends on.
  node-24:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (root + web, via postinstall)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the service
        run: npm run build:service
        env:
          NODE_ENV: production

      - name: Entrypoint contracts
        run: |
          node --test apps/api/test/platform-launcher.test.mjs
          node --test apps/api/test/service-entry.test.mjs
        env:
          NODE_ENV: test

  audit-trail:
    name: Requirement traceability present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traceability audit
        run: node scripts/check-traceability.mjs
      - name: Required documentation set
        run: |
          for f in SECURITY DATABASE DEPLOYMENT BACKUP-RECOVERY RUNBOOK REQUIREMENT-TRACEABILITY; do
            test -f "docs/$f.md" || { echo "::error::docs/$f.md missing"; exit 1; }
          done
      - name: No fabricated test or evidence markers
        run: |
          # A skipped/only/fixme test or a hard-coded "pass" is how a suite lies.
          if grep -rnE "(describe|test|it)\.(skip|only)\(" apps/api/test apps/web/src --include=*.mjs --include=*.ts --include=*.tsx; then
            echo "::error::skipped or exclusive tests are not allowed"; exit 1
          fi
